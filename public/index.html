<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutoPay Simple</title>
  <meta name="description" content="Send a client one secure link. They choose a bank account or card. Stripe charges them monthly. Sponsored by CREIGNIFICENT LLC." />
  <meta property="og:title" content="AutoPay Simple" />
  <meta property="og:description" content="One link. Monthly autopay. Card and bank details stay on Stripe." />
  <meta property="og:image" content="https://cdn.jsdelivr.net/gh/CreigT/autopay-simple@main/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;650&display=swap" rel="stylesheet" />
  <style>
    body { margin:0; font-family:Outfit,sans-serif; background:#f4f1ea; color:#17231c; }
    .wrap { width:min(880px, calc(100% - 24px)); margin:0 auto; padding:24px 0 40px; }
    h1 { font-size:40px; margin:8px 0; }
    .sponsor { color:#1c6b45; letter-spacing:.12em; font-size:12px; font-weight:700; }
    .card { background:#fff; border:1px solid #e2ddd2; border-radius:16px; padding:16px; margin:12px 0; }
    label { display:block; font-weight:700; font-size:13px; margin:8px 0 4px; }
    input { width:100%; padding:12px; border:1px solid #e2ddd2; border-radius:10px; font:inherit; }
    button { background:#114831; color:#fff; border:0; border-radius:999px; padding:12px 16px; font:inherit; margin-top:12px; }
    .ghost { background:#fff; color:#17231c; border:1px solid #e2ddd2; }
    .row { display:flex; justify-content:space-between; gap:8px; padding:10px 0; border-bottom:1px solid #eee; }
    .err { color:#8d2f2f; } .ok { color:#114831; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="sponsor">SPONSORED BY CREIGNIFICENT LLC</div>
    <h1>AutoPay Simple</h1>
    <p>Create a client. Stripe sends them to a secure page to choose a bank account or card. Stripe charges them every month.</p>
    <div class="card" id="login">
      <label>Owner password</label>
      <input id="password" type="password" />
      <button onclick="login()">Open dashboard</button>
      <p id="login-msg" class="err"></p>
    </div>
    <div id="app" class="hidden">
      <div class="card">
        <h2>Create client</h2>
        <label>Name</label><input id="name" />
        <label>Email</label><input id="email" type="email" />
        <label>Monthly amount</label><input id="amount" type="number" min="1" step="0.01" />
        <label>Billing day</label><input id="day" type="number" min="1" max="28" />
        <button onclick="createClient()">Create Stripe enrollment link</button>
        <p id="create-msg"></p>
      </div>
      <div class="card">
        <h2>Clients</h2>
        <div id="list">No clients yet.</div>
      </div>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    function token() { return sessionStorage.getItem("autopay-owner") || ""; }
    async function login() {
      const response = await fetch("/api/login", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ password: $("password").value }) });
      const data = await response.json();
      if (!response.ok) { $("login-msg").textContent = data.error || "Login failed"; return; }
      sessionStorage.setItem("autopay-owner", data.token);
      showApp();
    }
    function showApp() {
      $("login").style.display = "none";
      $("app").classList.remove("hidden");
      load();
    }
    async function createClient() {
      $("create-msg").textContent = "Creating the Stripe link...";
      const response = await fetch("/api/checkout", {
        method:"POST",
        headers:{ "Content-Type":"application/json", Authorization:"Bearer " + token() },
        body: JSON.stringify({ name:$("name").value, email:$("email").value, amount:$("amount").value, day:$("day").value })
      });
      const data = await response.json();
      if (!response.ok) { $("create-msg").className = "err"; $("create-msg").textContent = data.error || "Could not create the link"; return; }
      $("create-msg").className = "ok";
      $("create-msg").innerHTML = "Send this link to the client only: <a href='" + data.url + "'>" + data.url + "</a>";
      load();
    }
    async function load() {
      const response = await fetch("/api/clients", { headers:{ Authorization:"Bearer " + token() } });
      const data = await response.json();
      if (!response.ok) { $("list").textContent = data.error || "Could not load clients"; return; }
      $("list").innerHTML = (data.clients || []).map((c) => "<div class='row'><div><b>" + c.name + "</b><br>" + c.email + "<br>$" + Number(c.amount).toFixed(2) + " · day " + c.day + "</div><div>" + c.status + "</div></div>").join("") || "No clients yet.";
    }
    if (token()) showApp();
  </script>
</body>
</html>
